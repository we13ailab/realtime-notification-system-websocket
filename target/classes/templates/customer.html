<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Track your order</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <style>
        :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17231e; background: #f3f6f2; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; }
        main { width: min(100%, 650px); padding: 38px; border: 1px solid #e3e9e3; border-radius: 22px; background: #fff; box-shadow: 0 18px 50px #19352312; }
        .eyebrow { margin: 0 0 10px; color: #568366; font-size: .75rem; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
        h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.4rem); letter-spacing: -.04em; }
        .intro { margin: 12px 0 24px; color: #6b7770; line-height: 1.6; }
        .connection { display: flex; align-items: center; gap: 9px; margin-bottom: 27px; color: #66736b; font-size: .9rem; }
        .dot { width: 9px; height: 9px; border-radius: 50%; background: #d29a37; }
        .dot.online { background: #27945b; box-shadow: 0 0 0 4px #27945b1a; }
        .status-card { display: flex; align-items: center; gap: 17px; padding: 21px; border: 1px solid #e5ebe5; border-radius: 15px; background: #f9fbf9; }
        .status-icon { display: grid; flex: 0 0 46px; height: 46px; place-items: center; border-radius: 13px; background: #e8f2e9; color: #39704b; font-size: 1.3rem; }
        .status-label { margin: 0 0 5px; color: #738077; font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        #status { margin: 0; font-size: 1.25rem; font-weight: 730; text-transform: capitalize; }
        #timestamp { margin: 6px 0 0; color: #758178; font-size: .88rem; }
        .timeline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 27px; }
        .step { padding-top: 13px; border-top: 3px solid #e7ece7; color: #909a92; font-size: .82rem; font-weight: 650; }
        .step.active { border-color: #56a06a; color: #39704b; }
        a { display: inline-block; margin-top: 27px; color: #39704b; font-size: .9rem; font-weight: 650; text-decoration: none; }
        a:hover { text-decoration: underline; }
        @media (max-width: 480px) { main { padding: 27px 21px; } .timeline { gap: 6px; } .step { font-size: .72rem; } }
    </style>
</head>
<body>
<main>
    <p class="eyebrow">Live order tracking</p>
    <h1>Your order, in progress</h1>
    <p class="intro">We’ll show the latest update from the restaurant as soon as it happens.</p>
    <div class="connection"><span id="connectionDot" class="dot"></span><span id="connectionText">Connecting to live updates…</span></div>
    <section class="status-card" aria-live="polite">
        <div class="status-icon" aria-hidden="true">&#10003;</div>
        <div>
            <p class="status-label">Current status</p>
            <p id="status">Waiting for restaurant</p>
            <p id="timestamp">No update received yet</p>
        </div>
    </section>
    <div class="timeline" aria-label="Order progress">
        <div class="step" data-step="prepared">Prepared</div>
        <div class="step" data-step="pickedup">Picked up</div>
        <div class="step" data-step="delivered">Delivered</div>
    </div>
    <a href="/restaurant">Restaurant console &rarr;</a>
</main>
<script>
    const statusLabel = document.getElementById("status");
    const timestamp = document.getElementById("timestamp");
    const connectionDot = document.getElementById("connectionDot");
    const connectionText = document.getElementById("connectionText");
    const steps = [...document.querySelectorAll("[data-step]")];
    const progress = ["prepared", "pickedup", "delivered"];

    function showUpdate(update) {
        statusLabel.textContent = update.status === "pending" ? "Waiting for restaurant" : update.status;
        timestamp.textContent = new Date(update.timestamp).toLocaleString();
        const activeIndex = progress.indexOf(update.status);
        steps.forEach((step, index) => step.classList.toggle("active", activeIndex >= index));
    }

    function connect() {
        const stompClient = Stomp.over(new SockJS("/ws"));
        stompClient.debug = null;
        stompClient.connect({}, () => {
            connectionDot.classList.add("online");
            connectionText.textContent = "Connected · tracking live";
            stompClient.subscribe("/topic/order-status", frame => showUpdate(JSON.parse(frame.body)));
            stompClient.subscribe("/app/order-status", frame => showUpdate(JSON.parse(frame.body)));
        }, () => {
            connectionDot.classList.remove("online");
            connectionText.textContent = "Connection lost · reconnecting…";
            window.setTimeout(connect, 3000);
        });
    }

    connect();
</script>
</body>
</html>
