<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restaurant order updates</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <style>
        :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17231e; background: #f3f6f2; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; }
        main { width: min(100%, 620px); padding: 38px; border: 1px solid #e3e9e3; border-radius: 22px; background: #fff; box-shadow: 0 18px 50px #19352312; }
        .eyebrow { margin: 0 0 10px; color: #568366; font-size: .75rem; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
        h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.4rem); letter-spacing: -.04em; }
        .intro { margin: 12px 0 28px; color: #6b7770; line-height: 1.6; }
        .connection { display: flex; align-items: center; gap: 9px; margin-bottom: 24px; color: #66736b; font-size: .9rem; }
        .dot { width: 9px; height: 9px; border-radius: 50%; background: #d29a37; }
        .dot.online { background: #27945b; box-shadow: 0 0 0 4px #27945b1a; }
        .actions { display: grid; gap: 12px; }
        button { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 17px 19px; border: 1px solid #e4e9e4; border-radius: 13px; background: #fff; color: #26352c; text-align: left; font: inherit; font-weight: 680; cursor: pointer; transition: border-color .2s, transform .2s, background .2s; }
        button:hover:enabled { transform: translateY(-1px); border-color: #84ad8e; background: #f8fbf8; }
        button:disabled { cursor: not-allowed; opacity: .48; }
        button span:last-child { color: #829087; font-size: 1.15rem; }
        .last-update { min-height: 54px; margin-top: 24px; padding: 15px 17px; border-radius: 12px; background: #f5f8f5; color: #647168; font-size: .9rem; line-height: 1.5; }
        .last-update strong { color: #26352c; }
        a { display: inline-block; margin-top: 23px; color: #39704b; font-size: .9rem; font-weight: 650; text-decoration: none; }
        a:hover { text-decoration: underline; }
        @media (max-width: 480px) { main { padding: 27px 21px; } }
    </style>
</head>
<body>
<main>
    <p class="eyebrow">Restaurant console</p>
    <h1>Order status</h1>
    <p class="intro">Keep your customer in the loop. Choose an update to send it instantly.</p>
    <div class="connection"><span id="connectionDot" class="dot"></span><span id="connectionText">Connecting to live updates…</span></div>
    <div class="actions">
        <button type="button" data-status="prepared" disabled><span>Order prepared</span><span>01</span></button>
        <button type="button" data-status="pickedup" disabled><span>Picked up</span><span>02</span></button>
        <button type="button" data-status="delivered" disabled><span>Delivered</span><span>03</span></button>
    </div>
    <div id="lastUpdate" class="last-update" aria-live="polite">Connect to the live service to send an update.</div>
    <a href="/customer">Open customer tracking page &rarr;</a>
</main>
<script>
    const buttons = document.querySelectorAll("[data-status]");
    const connectionDot = document.getElementById("connectionDot");
    const connectionText = document.getElementById("connectionText");
    const lastUpdate = document.getElementById("lastUpdate");
    let stompClient;

    function connect() {
        stompClient = Stomp.over(new SockJS("/ws"));
        stompClient.debug = null;
        stompClient.connect({}, () => {
            connectionDot.classList.add("online");
            connectionText.textContent = "Connected · updates are live";
            buttons.forEach(button => button.disabled = false);
            stompClient.subscribe("/topic/order-status", frame => showUpdate(JSON.parse(frame.body)));
            stompClient.subscribe("/app/order-status", frame => showUpdate(JSON.parse(frame.body)));
        }, () => {
            connectionDot.classList.remove("online");
            connectionText.textContent = "Connection lost · reconnecting…";
            buttons.forEach(button => button.disabled = true);
            window.setTimeout(connect, 3000);
        });
    }

    function showUpdate(update) {
        lastUpdate.innerHTML = `<strong>Latest update: ${update.status}</strong><br>${new Date(update.timestamp).toLocaleString()}`;
    }

    buttons.forEach(button => button.addEventListener("click", () => {
        if (stompClient && stompClient.connected) {
            stompClient.send("/app/order-status", {}, JSON.stringify({status: button.dataset.status}));
        }
    }));

    connect();
</script>
</body>
</html>
